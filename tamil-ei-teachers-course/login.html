<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Emotional Intelligence for Teachers</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <span class="badge-dot"></span>
    <h1>Emotional Intelligence for Teachers</h1>
    <p class="sub">N T Somasundaram Life Skills Program</p>

    <div class="auth-error" id="auth-error"></div>
    <div class="auth-msg" id="auth-msg"></div>

    <form id="login-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" class="auth-input" placeholder="you@example.com" required>
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-navy">Sign In</button>
    </form>

    <div style="margin-top:18px;">
      <button class="auth-link" id="forgot-btn">Forgot password?</button>
    </div>

    <div style="margin-top:22px;font-size:13px;color:var(--muted);">
      Course access issue? <a href="https://wa.me/919843702244" target="_blank" style="color:var(--navy);font-weight:700;">WhatsApp us</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  function getRedirectTarget(){
    const params = new URLSearchParams(window.location.search);
    return params.get("redirect") || "index.html";
  }

  function showError(msg){
    const el = document.getElementById("auth-error");
    el.textContent = msg;
    el.classList.add("show");
    document.getElementById("auth-msg").classList.remove("show");
  }
  function showMsg(msg){
    const el = document.getElementById("auth-msg");
    el.textContent = msg;
    el.classList.add("show");
    document.getElementById("auth-error").classList.remove("show");
  }

  // If already signed in, skip straight to the course.
  auth.onAuthStateChanged(function(user){
    if(user){
      window.location.href = getRedirectTarget();
    }
  });

  document.getElementById("login-form").addEventListener("submit", function(e){
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email, password)
      .then(function(){
        window.location.href = getRedirectTarget();
      })
      .catch(function(err){
        showError(err.message || "Sign in failed. Please check your email and password.");
      });
  });

  document.getElementById("forgot-btn").addEventListener("click", function(){
    const email = document.getElementById("email").value.trim();
    if(!email){
      showError("Type your email above first, then tap 'Forgot password?' again.");
      return;
    }
    auth.sendPasswordResetEmail(email)
      .then(function(){
        showMsg("Password reset email sent to " + email + ".");
      })
      .catch(function(err){
        showError(err.message || "Could not send reset email.");
      });
  });
</script>
</body>
</html>
