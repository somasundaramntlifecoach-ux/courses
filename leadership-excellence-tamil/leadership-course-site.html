>____________________________________</p>\n<hr>"}, {"title": "செயல் திட்டம்", "body": "<p><em>(Action Plan: Building Influence)</em></p>\n<p>இந்த மாதத்தில்:</p>\n<ul><li>ஒரு முக்கியமான பங்குதாரருடன் நல்லுறவை வளர்க்க, நான் செய்யப்போகும் <strong>\"Goodwill Deposit\"</strong>:</li></ul>\n<hr>\n<ul><li>அடுத்த பேச்சுவார்த்தையில் கருத்து வேறுபாட்டைத் தீர்க்க, நான் பயன்படுத்தப்போகும் <strong>புறநிலை ஆதாரம் (Objective Criteria)</strong>:</li></ul>\n<hr>\n<ul><li>எனது Stakeholder Map-ஐ நான் மீண்டும் மதிப்பாய்வு செய்யும் தேதி:</li></ul>\n<p>______________________________</p>"}]}, {"num": 13, "title": "ஒழுக்கமான தலைமைத்துவம் மற்றும் நேர்மை", "subtitle": "(Ethical Leadership & Integrity)", "intro": "<h4 class=\"objective-label\">கற்றல் நோக்கம்</h4>\n<p>இந்தப் பாடத்தின் முடிவில், <strong>நேர்மையுடன் (Integrity)</strong> தலைமைத்துவம் வழங்கவும், <strong>ஒழுக்கநெறி அடிப்படையிலான முடிவுகளை</strong> எடுக்கவும், <strong>நம்பிக்கையை மையமாகக் கொண்ட பணியிட கலாச்சாரத்தை</strong> உருவாக்கவும் கற்றுக்கொள்வீர்கள்.</p>\n<hr>", "lessons": [{"title": "ஒழுக்கம் என்பது ஒரு தலைமைத்துவத் திறன்", "body": "<p><em>(Why Ethics is a Leadership Skill, Not Just a Personal Virtue)</em></p>\n<p>ஒழுக்கம் என்பது ஒருவரின் தனிப்பட்ட நல்ல குணம் மட்டுமல்ல.</p>\n<p>ஒரு தலைவரின் ஒவ்வொரு ஒழுக்கமான முடிவும், முழுக் குழுவின் நடத்தையில் தாக்கத்தை ஏற்படுத்துகிறது.</p>\n<p>குழு உறுப்பினர்கள்:</p>\n<ul><li>தலைவர் என்ன பேசுகிறார் என்பதைவிட,</li><li>அவர் என்ன செய்கிறார் என்பதை அதிகமாகக் கவனிக்கிறார்கள்.</li></ul>\n<p>அதன் அடிப்படையிலேயே அவர்கள் தங்களுடைய பணித் தரங்களையும் ஒழுக்கக் கொள்கைகளையும் அமைத்துக்கொள்கிறார்கள்.</p>\n<p><strong>\"இந்த ஒரு முறை மட்டும்...\"</strong> என்று செய்யப்படும் சிறிய சமரசங்கள் கூட தனிப்பட்ட நிகழ்வுகளாக இருப்பதில்லை.</p>\n<p>அவை, எதிர்காலத்தில் முழுக் குழுவும் பின்பற்றக்கூடிய ஒரு முன்னுதாரணமாக மாறுகின்றன.</p>\n<hr>"}, {"title": "ஒழுக்கமான முடிவுகளுக்கான எளிய சோதனை", "body": "<p><em>(A Simple Ethical Decision Test)</em></p>\n<p>ஒரு முக்கியமான முடிவை எடுப்பதற்கு முன், உங்களையே இந்த நான்கு கேள்விகளைக் கேளுங்கள்.</p>\n<h3>1. இது சட்டப்படி சரியானதா?</h3>\n<p>இந்த முடிவு நடைமுறையிலுள்ள சட்டங்களையும் விதிமுறைகளையும் பின்பற்றுகிறதா?</p>\n<hr>\n<h3>2. இது நமது நிறுவனத்தின் மதிப்புகளுடன் பொருந்துகிறதா?</h3>\n<p>நாம் கூறும் மதிப்புகளுக்கும் இந்த முடிவுக்கும் ஒற்றுமை உள்ளதா?</p>\n<hr>\n<h3>3. இந்த முடிவு பொதுமக்களுக்கு தெரியவந்தாலும் எனக்கு வசதியாக இருக்குமா?</h3>\n<p>இந்த முடிவு நாளை செய்தித்தாளில் வந்தாலும் நான் நிம்மதியாக இருப்பேனா?</p>\n<hr>\n<h3>4. இதையே யாராவது எனக்கோ அல்லது என் குழுவுக்கோ செய்தால் நான் எப்படி உணர்வேன்?</h3>\n<p>இந்தக் கேள்வி, மற்றவர்களின் பார்வையிலிருந்தும் சிந்திக்க உதவுகிறது.</p>\n<p>இந்த நான்கு கேள்விகளில் ஏதேனும் ஒன்றிற்கு பதிலளிக்கும்போது தயக்கம் ஏற்பட்டால்,</p>\n<p>அந்த முடிவை எடுப்பதற்கு முன் சற்று நிதானித்து மீண்டும் சிந்திக்க வேண்டும்.</p>\n<hr>"}, {"title": "ஒழுக்க ரீதியாக சிக்கலான சூழ்நிலைகளை கையாளுதல்", "body": "<p><em>(Handling Ethical Grey Areas)</em></p>\n<p>ஒவ்வொரு ஒழுக்கச் சிக்கலுக்கும் தெளிவான சரி–தவறு பதில் இருக்காது.</p>\n<p>சில நேரங்களில் இரண்டு நல்ல கொள்கைகள் ஒன்றுக்கொன்று முரண்படலாம்.</p>\n<p>உதாரணமாக:</p>\n<ul><li>சிரமத்தில் இருக்கும் ஒரு குழு உறுப்பினருக்கு விசுவாசமாக இருப்பதா?</li><li>அல்லது முழுக் குழுவிற்கும் நியாயமாக இருப்பதா?</li></ul>\n<p>இத்தகைய சூழலில்,</p>\n<p>சிக்கலை எளிதானது போலக் காட்டாமல்,</p>\n<p>அதில் உள்ள உண்மையான முரண்பாட்டை வெளிப்படையாக ஏற்றுக்கொள்ள வேண்டும்.</p>\n<p>தேவையானபோது,</p>\n<ul><li>நம்பகமான ஆலோசகர்கள்,</li><li>மனிதவளத் துறை (HR)</li></ul>\n<p>ஆகியோரின் ஆலோசனையையும் பெற வேண்டும்.</p>\n<hr>"}, {"title": "பேசத் துணியும் பணியிட கலாச்சாரத்தை உருவாக்குதல்", "body": "<p><em>(Building a Speak-Up Culture)</em></p>\n<p>மக்கள் தங்களுடைய:</p>\n<ul><li>கவலைகளை,</li><li>தவறுகளை,</li><li>ஒழுக்கச் சிக்கல்களை</li></ul>\n<p>வெளிப்படையாகப் பகிர்வார்கள்,</p>\n<p>அவர்களுக்கு தண்டனை கிடைக்காது என்ற நம்பிக்கை இருந்தால் மட்டுமே.</p>\n<p>ஒரு தலைவர் இதை உருவாக்குவதற்கு:</p>\n<ul><li>மோசமான செய்திகளைக் கூட அமைதியாகக் கேட்க வேண்டும்.</li><li>பிரச்சினைகளை வெளிப்படுத்தியவர்களுக்கு நன்றி சொல்ல வேண்டும்.</li><li>கூறிய நடவடிக்கைகளை நடைமுறையில் செயல்படுத்த வேண்டும்.</li></ul>\n<p>இவ்வாறு செயல்படும் போது, குழுவில் நம்பிக்கையும் வெளிப்படைத்தன்மையும் அதிகரிக்கும்.</p>\n<hr>"}, {"title": "நிஜ வாழ்க்கை உதாரணம்", "body": "<p><em>(Real-Life Example: The Number That Didn't Add Up)</em></p>\n<p><strong>சுரேஷ்</strong> என்ற குழுத் தலைவர், ஒரு இளம் பகுப்பாய்வாளர் (Junior Analyst) வாடிக்கையாளருக்குக் கொடுக்கப்படும் செயல்திறன் அறிக்கையில் (Performance Report), காலாண்டு இலக்கை அடைய வேண்டுமென்பதற்காக ஒரு எண்ணை சற்று அதிகமாகக் காட்டியிருப்பதை கவனித்தார்.</p>\n<p>அந்த பகுப்பாய்வாளர் கூறினார்:</p>\n<p>> <strong>\"இந்த ஒரு முறை மட்டும்... உண்மைக்கு மிகவும் அருகில்தான் இருக்கிறது.\"</strong></p>\n<p>சுரேஷ் அவரை அனைவரின் முன்னிலும் கண்டிக்கவில்லை.</p>\n<p>அதே நேரத்தில், அந்தச் செயலை அமைதியாக விட்டுவிடவும் இல்லை.</p>\n<p>தனியாக அமைதியாகப் பேசினார்.</p>\n<p>அவர் கூறினார்:</p>\n<p>> <strong>\"இலக்கை அடைய வேண்டிய அழுத்தம் இருப்பதை நான் புரிந்துகொள்கிறேன். ஆனால் இன்று இந்த எண்ணை மாற்றத் தொடங்கினால், அடுத்த காலாண்டில் எங்கு நிறுத்தப் போகிறோம்?\"</strong></p>\n<p>அதன்பிறகு:</p>\n<ul><li>தவறான எண் திருத்தப்பட்டது.</li><li>வாடிக்கையாளருக்கு தவறான தகவல் செல்லவில்லை.</li><li>முக்கியமாக, அந்த பகுப்பாய்வாளர் பின்னர் தனது சக ஊழியரிடம்,</li></ul>\n<p><strong>\"இந்தக் குழுவில் நல்ல தோற்றத்தை விட நேர்மைக்குத்தான் அதிக மதிப்பு இருக்கிறது என்பதை அன்றுதான் உணர்ந்தேன்.\"</strong></p>\n<p>என்று பகிர்ந்தார்.</p>\n<hr>"}, {"title": "உவமை", "body": "<p><em>(Metaphor)</em></p>\n<p>> <strong>\"ஒழுக்கம் என்பது வீட்டின் கூரை அல்ல; அது அதன் அடித்தளம். அடித்தளத்தில் விரிசல் ஏற்பட்டால், முழு வீடும் பாதிக்கப்படும்.\"</strong></p>\n<p>ஒரு வீட்டின் கூரையை பழுதுபார்ப்பது எளிதாக இருக்கலாம்.</p>\n<p>ஆனால், அடித்தளத்தில் ஏற்படும் சிறிய விரிசல் கூட,</p>\n<p>மேலே கட்டப்பட்டுள்ள முழு கட்டிடத்தையும் ஆபத்தில் ஆழ்த்தும்.</p>\n<p>அதேபோல்,</p>\n<p>சிறிய ஒழுக்கச் சமரசங்களும் உடனடியாக வெளிப்படையாகத் தெரியாவிட்டாலும்,</p>\n<p>அவை அமைப்பின் அடிப்படை நம்பிக்கையையே மெதுவாக பலவீனப்படுத்துகின்றன.</p>\n<hr>"}, {"title": "பணித்தாள்", "body": "<p><em>(Worksheet: The Ethics Check)</em></p>\n<p><strong>1.</strong> சமீபத்தில் நீங்கள் செய்த <strong>\"இந்த ஒரு முறை மட்டும்\"</strong> என்ற சிறிய சமரசத்தை நினைவுகூருங்கள்.</p>\n<p>அது எந்த முன்னுதாரணத்தை உருவாக்கியிருக்கலாம்?</p>\n<hr>\n<p><strong>2.</strong> சமீபத்தில் எடுத்த ஒரு கடினமான முடிவை, இந்த <strong>4 ஒழுக்கக் கேள்விகளின்</strong> அடிப்படையில் மதிப்பாய்வு செய்யுங்கள்.</p>\n<p>அது இந்தச் சோதனையில் வெற்றி பெறுகிறதா?</p>\n<hr>\n<p><strong>3.</strong> உங்கள் குழுவினர் மோசமான செய்திகளைக் கூட உடனடியாக உங்களிடம் பகிர்வார்கள் என்ற நம்பிக்கை உங்களுக்கு எவ்வளவு உள்ளது?</p>\n<p>ஏன்?</p>\n<p>____________________________________</p>\n<hr>"}, {"title": "செயல் திட்டம்", "body": "<p><em>(Action Plan: Strengthening My Ethical Foundation)</em></p>\n<p>இந்த வாரத்தில்:</p>\n<ul><li>பழக்கமாக மாறுவதற்கு முன் நான் சரிசெய்யப் போகும் ஒரு சிறிய ஒழுக்கச் சமரசம்:</li></ul>\n<hr>\n<ul><li>இந்த மாதத்தில் ஒரு கடினமான பிரச்சினையைத் தைரியமாக முன்வைக்கும் ஒருவருக்கு நான் நன்றி தெரிவிக்கும் ஒரு வழி:</li></ul>\n<hr>\n<ul><li>என் குழுவினர் என்னிடம் வைத்துள்ள நம்பிக்கையை நான் <strong>இந்த தேதியில்</strong> மீண்டும் சிந்தித்து மதிப்பாய்வு செய்வேன்:</li></ul>"}]}, {"num": 14, "title": "தனிப்பட்ட தலைமைத்துவ செயல் திட்டம் மற்றும் தொடர்ச்சியான வளர்ச்சி", "subtitle": "(Personal Leadership Action Plan & Continuous Growth)", "intro": "<h4 class=\"objective-label\">கற்றல் நோக்கம்</h4>\n<p>இந்தப் பாடத்தின் முடிவில், இந்தப் பயிற்சியின் அனைத்து கற்றல்களையும் ஒருங்கிணைத்து, <strong>தெளிவான, செயல்படுத்தக்கூடிய மற்றும் தனிப்பட்ட தலைமைத்துவ வளர்ச்சித் திட்டத்தை</strong> உருவாக்கக் கற்றுக்கொள்வீர்கள்.</p>\n<hr>", "lessons": [{"title": "ஏன் பெரும்பாலான வளர்ச்சித் திட்டங்கள் தோல்வியடைகின்றன?", "body": "<p><em>(Why Most Development Plans Fail)</em></p>\n<p>பலர் பயிற்சி முடிந்தவுடன்,</p>\n<p>> <strong>\"நான் ஒரு சிறந்த தொடர்பாளர் ஆக வேண்டும்.\"</strong></p>\n<p>அல்லது</p>\n<p>> <strong>\"நான் ஒரு நல்ல தலைவர் ஆக வேண்டும்.\"</strong></p>\n<p>என்று பொதுவான இலக்குகளை எழுதுகிறார்கள்.</p>\n<p>ஆனால், இத்தகைய தெளிவற்ற நோக்கங்கள் நடைமுறையில் மாற்றத்தை ஏற்படுத்துவதில்லை.</p>\n<p>அதற்குப் பதிலாக,</p>\n<p>குறிப்பிட்ட (Specific),</p>\n<p>கவனிக்கக்கூடிய (Observable),</p>\n<p>காலவரம்புடைய (Time-bound)</p>\n<p>உறுதிப்பாடுகள் மட்டுமே நடத்தை மாற்றத்திற்கு வழிவகுக்கின்றன.</p>\n<p>உதாரணமாக:</p>\n<p>> <strong>\"இந்த மாதம் நடைபெறும் ஒவ்வொரு குழுக் கூட்டத்திலும், கருத்து வேறுபாடு ஏற்பட்டால் பதிலளிப்பதற்கு முன் மூன்று விநாடிகள் இடைவெளி விடுவேன்.\"</strong></p>\n<p>இத்தகைய இலக்குகள் எளிதாகப் பின்பற்றவும் மதிப்பாய்வு செய்யவும் முடியும்.</p>\n<hr>"}, {"title": "தலைமைத்துவ வளர்ச்சிக்கான 70-20-10 மாதிரி", "body": "<p><em>(The 70-20-10 Model for Leadership Growth)</em></p>\n<p>ஒரு தலைவரின் வளர்ச்சி மூன்று முக்கியமான வழிகளில் நடைபெறுகிறது.</p>\n<h3>70% – பணியிட அனுபவங்கள்</h3>\n<p>தினசரி வேலைகள்,</p>\n<p>புதிய பொறுப்புகள்,</p>\n<p>சவாலான திட்டங்கள்</p>\n<p>ஆகியவற்றின் மூலம் பெரும்பாலான தலைமைத்துவ வளர்ச்சி நிகழ்கிறது.</p>\n<hr>\n<h3>20% – கருத்துப்பரிமாற்றம் மற்றும் உறவுகள்</h3>\n<ul><li>வழிகாட்டிகள் (Mentors)</li><li>மேலாளர்கள்</li><li>சக ஊழியர்கள்</li></ul>\n<p>ஆகியோரின் கருத்துகள் மற்றும் ஆதரவு வளர்ச்சிக்கு முக்கிய பங்கு வகிக்கின்றன.</p>\n<hr>\n<h3>10% – முறையான பயிற்சிகள்</h3>\n<p>இந்தப் பாடநெறி போன்ற பயிற்சிகள்,</p>\n<p>அறிவையும் கருவிகளையும் வழங்குகின்றன.</p>\n<p>ஆனால், அவற்றை பணியிடத்தில் நடைமுறைப்படுத்தும்போதுதான் உண்மையான வளர்ச்சி ஏற்படுகிறது.</p>\n<hr>"}, {"title": "முக்கியமான 2–3 முன்னுரிமைகளைத் தேர்ந்தெடுக்கவும்", "body": "<p><em>(Choosing Your Top 2–3 Priorities)</em></p>\n<p>இந்த 14 தொகுதிகளிலும் கற்ற அனைத்தையும் ஒரே நேரத்தில் மாற்ற முயற்சித்தால்,</p>\n<p>இறுதியில் எந்த மாற்றமும் நிகழாமல் போகலாம்.</p>\n<p>எனவே,</p>\n<p>ஒவ்வொரு தொகுதியிலும் நீங்கள் எழுதிய குறிப்புகளையும் சிந்தனைகளையும் மீண்டும் பாருங்கள்.</p>\n<p>பின்னர்,</p>\n<p>அடுத்த <strong>90 நாட்களில்</strong> உங்கள் குழுவிற்கு அதிக தாக்கத்தை ஏற்படுத்தக்கூடிய</p>\n<p><strong>2 அல்லது 3 தலைமைத்துவ நடத்தைகளை மட்டும்</strong> தேர்ந்தெடுக்கவும்.</p>\n<p>குறைவான ஆனால் தெளிவான முன்னுரிமைகள், நீடித்த மாற்றத்தை உருவாக்கும்.</p>\n<hr>"}, {"title": "பொறுப்புணர்வு அமைப்பை உருவாக்குங்கள்", "body": "<p><em>(Building an Accountability Loop)</em></p>\n<p>வளர்ச்சி தொடர்ச்சியாக நடைபெற வேண்டுமெனில்,</p>\n<p>ஒரு <strong>பொறுப்புணர்வு அமைப்பு (Accountability Loop)</strong> தேவை.</p>\n<p>அதற்காக:</p>\n<ul><li>உங்கள் வளர்ச்சி இலக்குகளை உங்கள் மேலாளர் அல்லது நம்பகமான சக ஊழியருடன் பகிருங்கள்.</li><li>ஒரு குறிப்பிட்ட மதிப்பாய்வு தேதியை நிர்ணயியுங்கள்.</li><li>உங்கள் நடத்தையில் மாற்றம் ஏற்பட்டுள்ளதா என்பதை நேர்மையாகக் கூறக்கூடிய ஒருவரிடம் கருத்துக்களைக் கேளுங்கள்.</li></ul>\n<p>தொடர்ச்சியான கருத்துப்பரிமாற்றம், வளர்ச்சியை நிலையான பழக்கமாக மாற்றுகிறது.</p>\n<hr>"}, {"title": "நிஜ வாழ்க்கை உதாரணம்", "body": "<p><em>(Real-Life Example: The Vague Goal That Finally Became Real)</em></p>\n<p>ஒரு தலைமைத்துவப் பயிற்சிக்குப் பிறகு,</p>\n<p><strong>ஆனந்த்</strong> தனது குறிப்பேட்டில்,</p>\n<p>> <strong>\"நான் இன்னும் பொறுமையான தலைவராக இருக்க வேண்டும்.\"</strong></p>\n<p>என்று எழுதினார்.</p>\n<p>ஆறு மாதங்கள் கழித்தும் எந்த மாற்றமும் ஏற்படவில்லை.</p>\n<p>ஏனெனில்,</p>\n<p>அந்த இலக்கு மிகவும் பொதுவானதாக இருந்தது.</p>\n<p>பின்னர், மற்றொரு பயிற்சிக்குப் பிறகு அவர் தனது இலக்கை மாற்றினார்.</p>\n<p>அவர் எழுதினார்:</p>\n<p>> <strong>\"அடுத்த 30 நாட்களுக்கு, ஒரு குழு உறுப்பினர் கூட்டத்தில் தவறு செய்தால், அனைவரின் முன்னிலும் திருத்தாமல், கூட்டம் முடிந்த பிறகு தனிப்பட்ட முறையில் கருத்து தெரிவிப்பேன்.\"</strong></p>\n<p>இந்த இலக்கு:</p>\n<ul><li>தெளிவானது,</li><li>கவனிக்கக்கூடியது,</li><li>காலவரம்புடையது.</li></ul>\n<p>இரண்டு வாரங்களுக்குள்,</p>\n<p>அவரது குழு இந்த மாற்றத்தை கவனித்தது.</p>\n<p>ஒரு குழு உறுப்பினர் நேரடியாக,</p>\n<p>> <strong>\"இப்போது கூட்டங்கள் மிகவும் பாதுகாப்பாக உணரப்படுகின்றன.\"</strong></p>\n<p>என்று அவரிடம் கூறினார்.</p>\n<hr>"}, {"title": "உவமை", "body": "<p><em>(Metaphor)</em></p>\n<p>> <strong>\"வளர்ச்சி என்பது முதலில் வேர்கள்; பின்னர் தளிர்கள்.\"</strong></p>\n<p>சில வகை மூங்கில் செடிகள்,</p>\n<p>முதல் நான்கு ஆண்டுகள் வெளியில் எந்த வளர்ச்சியும் இல்லாமல் இருக்கும்.</p>\n<p>அந்தக் காலத்தில்,</p>\n<p>அவை நிலத்தடியில் வலுவான வேர்களை உருவாக்குகின்றன.</p>\n<p>பின்னர்,</p>\n<p>சில வாரங்களிலேயே மிக வேகமாக உயரமாக வளர்கின்றன.</p>\n<p>அதேபோல்,</p>\n<p>இந்த மாதம் நீங்கள் உருவாக்கும் சிறிய பழக்கங்கள்:</p>\n<ul><li>பதிலளிப்பதற்கு முன் சிறிது நேரம் சிந்திப்பது,</li><li>ஒரு பொறுப்பை ஒப்படைப்பது,</li><li>ஒரு நேர்மையான உரையாடலை நடத்துவது</li></ul>\n<p>போன்றவை உங்கள் தலைமைத்துவத்தின் <strong>வேர்கள்</strong> ஆகும்.</p>\n<p>அவற்றை தொடர்ந்து வளர்த்தால்,</p>\n<p>வெளிப்படையான மாற்றங்களும் வெற்றிகளும் இயல்பாக உருவாகும்.</p>\n<hr>"}, {"title": "பணித்தாள்", "body": "<p><em>(Worksheet: Choosing My Top Priorities)</em></p>\n<p><strong>1.</strong> இந்த 14 தொகுதிகளையும் மீண்டும் சிந்தித்துப் பாருங்கள்.</p>\n<p>அடுத்த <strong>90 நாட்களில்</strong> நீங்கள் மேம்படுத்தினால் உங்கள் குழுவில் மிகப்பெரிய தாக்கத்தை ஏற்படுத்தக்கூடிய <strong>2 அல்லது 3 தலைமைத்துவ நடத்தைகள்</strong> எவை?</p>\n<hr>\n<p><strong>2.</strong> உங்கள் முதல் முன்னுரிமைக்காக,</p>\n<p>ஒரு <strong>தெளிவான, கவனிக்கக்கூடிய, காலவரம்புடைய</strong> உறுதிப்பாட்டை எழுதுங்கள்.</p>\n<hr>\n<p><strong>3.</strong> இந்தத் திட்டத்தை நீங்கள் யாருடன் பகிரப் போகிறீர்கள்?</p>\n<p>முதல் மதிப்பாய்வு நடைபெறும் தேதி எது?</p>\n<p>____________________________________</p>\n<hr>"}, {"title": "செயல் திட்டம்", "body": "<p><em>(Action Plan: My 90-Day Leadership Commitment)</em></p>\n<p>அடுத்த <strong>90 நாட்களுக்கு:</strong></p>\n<h3>எனது முதல் தலைமைத்துவ முன்னுரிமை:</h3>\n<hr>\n<h3>நான் மேற்கொள்ளும் தெளிவான, கவனிக்கக்கூடிய, காலவரம்புடைய உறுதிப்பாடு:</h3>\n<hr>\n<h3>எனது பொறுப்புணர்வு இணைவர் (Accountability Partner) மற்றும் எங்களின் முதல் மதிப்பாய்வு தேதி:</h3>\n<hr>\n<h3>இந்த மாதத்தில் என் வளர்ச்சியை விரைவுபடுத்துவதற்காக நான் மேற்கொள்ளும் ஒரு புதிய பணியிட அனுபவம்:</h3>\n<p>____________________________________</p>\n<hr>\n<h4 class=\"objective-label\">🎉 வாழ்த்துகள்!</h4>\n<p><strong>Leadership Excellence for Working Professionals</strong> பயிற்சியின் <strong>அனைத்து 14 தொகுதிகளையும்</strong> வெற்றிகரமாக நிறைவு செய்துள்ளீர்கள்.</p>\n<p>இந்தப் பயிற்சியின் உண்மையான மதிப்பு, கற்ற கருத்துகளை <strong>தினசரி தலைமைத்துவ நடைமுறையில் தொடர்ந்து பயன்படுத்துவதில்தான்</strong> உள்ளது. உங்கள் தொடர்ச்சியான கற்றல், சுயபரிசோதனை மற்றும் செயலில் ஈடுபாடு, உங்களை நம்பகமான மற்றும் தாக்கமிக்க தலைவராக வளர்க்கும்.</p>"}]}]</script>
<script>
(function(){
  var COURSE = JSON.parse(document.getElementById('course-data').textContent);
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebarOverlay');
  var menuToggle = document.getElementById('menuToggle');
  var navEl = document.getElementById('sidebarNav');
  var contentEl = document.getElementById('contentInner');
  var brandHome = document.getElementById('brandHome');

  function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
  function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('show'); }
  menuToggle.addEventListener('click', function(){ sidebar.classList.contains('open') ? closeSidebar() : openSidebar(); });
  overlay.addEventListener('click', closeSidebar);
  brandHome.addEventListener('click', function(){ navigate('home'); });

  var flat = [{type:'home'}];
  COURSE.forEach(function(mod, mi){
    flat.push({type:'intro', mi: mi});
    mod.lessons.forEach(function(les, li){
      flat.push({type:'lesson', mi: mi, li: li});
    });
  });
  flat.push({type:'certificate'});

  function routeKey(r){
    if (r.type === 'home') return 'home';
    if (r.type === 'certificate') return 'certificate';
    if (r.type === 'intro') return 'm' + r.mi;
    return 'm' + r.mi + 'l' + r.li;
  }
  function parseHash(){
    var h = location.hash.replace('#','');
    if (!h) return {type:'home'};
    if (h === 'certificate') return {type:'certificate'};
    var m = h.match(/^m(\d+)l(\d+)$/);
    if (m) return {type:'lesson', mi:+m[1], li:+m[2]};
    var m2 = h.match(/^m(\d+)$/);
    if (m2) return {type:'intro', mi:+m2[1]};
    return {type:'home'};
  }
  function navigate(hash){ location.hash = hash; }

  function buildNav(activeKey){
    navEl.innerHTML = '';
    COURSE.forEach(function(mod, mi){
      var isActiveMod = activeKey === ('m'+mi) || activeKey.indexOf('m'+mi+'l') === 0;
      var group = document.createElement('div');
      group.className = 'mod-group' + (isActiveMod ? ' open' : '');

      var summary = document.createElement('div');
      summary.className = 'mod-summary';
      summary.innerHTML = '<span class="mod-num">' + String(mod.num).padStart(2,'0') + '</span><span class="mod-title">' + mod.title + '</span>';
      summary.addEventListener('click', function(){
        group.classList.toggle('open');
      });
      group.appendChild(summary);

      var ul = document.createElement('ul');
      ul.className = 'lesson-list';

      var introLi = document.createElement('li');
      var introA = document.createElement('a');
      introA.textContent = 'முன்னுரை & நோக்கம்';
      if (activeKey === 'm'+mi) introA.className = 'active';
      introA.addEventListener('click', function(){ navigate('m'+mi); });
      introLi.appendChild(introA);
      ul.appendChild(introLi);

      mod.lessons.forEach(function(les, li){
        var lLi = document.createElement('li');
        var a = document.createElement('a');
        a.textContent = les.title;
        if (activeKey === 'm'+mi+'l'+li) a.className = 'active';
        a.addEventListener('click', function(){ navigate('m'+mi+'l'+li); });
        lLi.appendChild(a);
        ul.appendChild(lLi);
      });

      group.appendChild(ul);
      navEl.appendChild(group);
    });
  }

  function navBtnsHtml(idx){
    var prevHtml = '<span></span>';
    var nextHtml = '';
    if (idx > 0){
      var p = flat[idx-1];
      var label = p.type === 'home' ? 'முகப்பு' : (p.type === 'intro' ? COURSE[p.mi].title + ' — முன்னுரை' : COURSE[p.mi].lessons[p.li].title);
      prevHtml = '<button class="nav-btn prev" data-hash="' + routeKey(p) + '">← ' + label + '</button>';
    }
    if (idx < flat.length - 1){
      var nx = flat[idx+1];
      var label2 = nx.type === 'certificate' ? 'பாடநெறியை முடி' : (nx.type === 'intro' ? COURSE[nx.mi].title + ' — முன்னுரை' : COURSE[nx.mi].lessons[nx.li].title);
      nextHtml = '<button class="nav-btn next" data-hash="' + routeKey(nx) + '">' + label2 + ' →</button>';
    }
    return prevHtml + nextHtml;
  }

  function attachNavBtns(){
    contentEl.querySelectorAll('.nav-btn[data-hash]').forEach(function(btn){
      btn.addEventListener('click', function(){ navigate(btn.getAttribute('data-hash')); });
    });
    contentEl.querySelectorAll('[data-goto]').forEach(function(el){
      el.addEventListener('click', function(){ navigate(el.getAttribute('data-goto')); });
    });
  }

  function renderHome(){
    var totalLessons = COURSE.reduce(function(s,m){return s + m.lessons.length;}, 0);
    var cards = COURSE.map(function(mod, mi){
      return '<div class="module-card" data-goto="m'+mi+'">' +
        '<span class="module-card-num">' + String(mod.num).padStart(2,'0') + '</span>' +
        '<span class="module-card-body"><span class="module-card-title">' + mod.title + '</span>' +
        '<span class="module-card-meta">' + mod.lessons.length + ' பாடங்கள்</span></span>' +
        '<span class="module-card-arrow">→</span></div>';
    }).join('');

    contentEl.innerHTML =
      '<section class="hero">' +
        '<span class="hero-eyebrow">14 தொகுதிகள் · ' + totalLessons + ' பாடங்கள் · தமிழில்</span>' +
        '<h1 class="hero-title">தலைமைத்துவ சிறப்பு பயிற்சி நெறி</h1>' +
        '<p class="hero-sub">Leadership Excellence Program — அடித்தளத்திலிருந்து செயல் திட்டம் வரை, ஒரு முழுமையான தலைமைத்துவப் பயணம்.</p>' +
        '<button class="hero-cta" data-goto="m0">பயிற்சியைத் தொடங்குங்கள் →</button>' +
      '</section>' +
      '<section class="module-grid-section">' +
        '<h2 class="section-heading">தொகுதிகள்</h2>' +
        '<div class="module-grid">' + cards + '</div>' +
      '</section>' +
      '<footer class="site-footer"><p>N T Somasundaram &middot; Certified Master Trainer &amp; Career Consultant</p><p class="footer-motto">God is always with u.</p></footer>';

    attachNavBtns();
  }

  function renderCertificate(){
    contentEl.innerHTML =
      '<section class="completion-card">' +
        '<span class="hero-eyebrow">பாடநெறி முடிவடைந்தது</span>' +
        '<h1 class="hero-title">🎉 வாழ்த்துகள்!</h1>' +
        '<p class="hero-sub">தலைமைத்துவ சிறப்பு பயிற்சி நெறியின் 14 தொகுதிகளையும் நீங்கள் நிறைவு செய்துவிட்டீர்கள். இப்போது கற்றதை நடைமுறையில் பயன்படுத்தும் நேரம்.</p>' +
        '<button class="hero-cta" data-goto="home">பாடநெறி பட்டியலுக்குத் திரும்பு →</button>' +
      '</section>' +
      '<footer class="site-footer"><p>N T Somasundaram &middot; Certified Master Trainer &amp; Career Consultant</p><p class="footer-motto">God is always with u.</p></footer>';
    attachNavBtns();
  }

  function renderIntro(mi, idx){
    var mod = COURSE[mi];
    contentEl.innerHTML =
      '<div class="crumb" data-goto="home">தொகுதி ' + mod.num + ' · ' + mod.title + '</div>' +
      '<h1 class="lesson-title">' + mod.title + '</h1>' +
      (mod.subtitle ? '<p class="subtitle">' + mod.subtitle + '</p>' : '') +
      '<div class="lesson-body">' + mod.intro + '</div>' +
      '<div class="page-nav">' + navBtnsHtml(idx) + '</div>';
    attachNavBtns();
  }

  function renderLesson(mi, li, idx){
    var mod = COURSE[mi];
    var les = mod.lessons[li];
    contentEl.innerHTML =
      '<div class="crumb" data-goto="home">தொகுதி ' + mod.num + ' · ' + mod.title + '</div>' +
      '<h1 class="lesson-title">' + les.title + '</h1>' +
      '<div class="lesson-body">' + les.body + '</div>' +
      '<div class="page-nav">' + navBtnsHtml(idx) + '</div>';
    attachNavBtns();
  }

  // ---------------- Firebase auth gate ----------------
  // The home route (course listing + purchase card) stays public.
  // Every other route (module intros, lessons, certificate) requires
  // login + enrollment in COURSE_ID.
  var COURSE_ID = "leadership-excellence-tamil";
  var authChecked = false;
  var currentUser = null;
  var isEnrolled = false;
  var learnerName = "";

  function renderChecking(){
    contentEl.innerHTML = '<section class="hero"><p class="hero-sub">அணுகல் சரிபார்க்கப்படுகிறது…</p></section>';
  }

  auth.onAuthStateChanged(async function(user){
    currentUser = user;
    isEnrolled = false;
    learnerName = "";
    if (user) {
      try {
        var doc = await db.collection("students").doc(user.uid).get();
        var data = doc.exists ? doc.data() : null;
        var enrolledCourses = (data && data.courses) || [];
        isEnrolled = enrolledCourses.includes(COURSE_ID);
        learnerName = (data && data.name) || "";
      } catch (err) {
        console.error("Access check failed:", err);
      }
    }
    authChecked = true;

    var authStatus = document.getElementById('authStatus');
    var logoutLink = document.getElementById('logoutLink');
    if (user) {
      authStatus.style.display = 'block';
      document.getElementById('learnerNameDisplay').textContent = learnerName;
      logoutLink.onclick = function(e){ e.preventDefault(); auth.signOut(); };
    } else {
      authStatus.style.display = 'none';
    }

    render();
  });

  function render(){
    var route = parseHash();
    var key = routeKey(route);
    var idx = flat.findIndex(function(r){ return routeKey(r) === key; });

    if (route.type !== 'home') {
      if (!authChecked) { renderChecking(); return; }
      if (!currentUser) { window.location.href = 'login.html'; return; }
      if (!isEnrolled) { window.location.href = 'not-enrolled.html'; return; }
    }

    buildNav(key);
    if (route.type === 'home') renderHome();
    else if (route.type === 'certificate') renderCertificate();
    else if (route.type === 'intro') renderIntro(route.mi, idx);
    else renderLesson(route.mi, route.li, idx);
    window.scrollTo(0,0);
    closeSidebar();
    var activeLink = navEl.querySelector('a.active');
    if (activeLink) activeLink.scrollIntoView({block:'center'});
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
