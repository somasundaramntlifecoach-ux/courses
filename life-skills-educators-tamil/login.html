<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>உள்நுழைவு | Life Skills Mastery for Educators</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1F44;
  --navy-deep:#071530;
  --navy-soft:#12315E;
  --gold:#C9A227;
  --gold-light:#E8C766;
  --cream:#F8F5EE;
  --ink:#1B2430;
  --muted:#5B6472;
  --line:#E4E1D6;
  --white:#FFFFFF;
  --radius:14px;
  --shadow:0 10px 30px rgba(10,31,68,0.10);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Noto Sans Tamil','Poppins',sans-serif;
  line-height:1.75;
  font-size:16.5px;
}
h1,h2,h3,h4{
  font-family:'Poppins','Noto Sans Tamil',sans-serif;
  color:var(--navy);
  line-height:1.35;
  margin:0 0 .6em;
}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
.container{max-width:1080px;margin:0 auto;padding:0 24px;}

/* header */
.site-header{
  background:var(--navy);
  color:var(--white);
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 14px rgba(0,0,0,.15);
}
.site-header .container{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;
}
.brand{display:flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:600;font-size:16px;color:var(--white);}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);}
.nav-links{display:flex;gap:26px;align-items:center;}
.nav-links a{font-size:14.5px;color:#E8E6DE;font-family:'Poppins',sans-serif;font-weight:500;}
.nav-links a:hover{color:var(--gold-light);}
.btn{
  display:inline-block;padding:12px 26px;border-radius:999px;
  font-family:'Poppins',sans-serif;font-weight:600;font-size:14.5px;
  cursor:pointer;border:none;text-align:center;
}
.btn-gold{background:var(--gold);color:var(--navy-deep);}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent;color:var(--white);border:1.5px solid rgba(255,255,255,.5);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-light);}
.btn-navy{background:var(--navy);color:var(--white);}
.btn-navy:hover{background:var(--navy-soft);}
.btn-block{display:block;width:100%;}

/* hero */
.hero{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
  color:var(--white);padding:76px 0 90px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-120px;top:-120px;width:400px;height:400px;
  border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.18),transparent 70%);
}
.badge{
  display:inline-block;background:rgba(201,162,39,.15);border:1px solid var(--gold);
  color:var(--gold-light);font-size:12.5px;font-family:'Poppins',sans-serif;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;padding:6px 16px;border-radius:999px;margin-bottom:22px;
}
.hero h1{color:var(--white);font-size:2.5rem;max-width:820px;}
.hero .sub{color:#D8DEE9;font-size:1.15rem;max-width:680px;margin-bottom:30px;}
.hero-cta{display:flex;gap:16px;flex-wrap:wrap;}

/* sections */
section{padding:64px 0;}
.section-title{text-align:center;margin-bottom:12px;font-size:2rem;}
.section-sub{text-align:center;color:var(--muted);max-width:640px;margin:0 auto 44px;font-size:1.02rem;}
.tag{color:var(--gold);font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;text-align:center;display:block;margin-bottom:10px;}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;}
@media(max-width:860px){.grid-3{grid-template-columns:1fr;}.grid-2{grid-template-columns:1fr;}}

.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;box-shadow:var(--shadow);
}

/* about */
.about-photo{
  width:100%;aspect-ratio:4/3;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--navy-soft),var(--navy));
  display:flex;align-items:center;justify-content:center;color:var(--gold-light);
  font-family:'Poppins',sans-serif;font-weight:700;font-size:3rem;box-shadow:var(--shadow);
}

/* curriculum accordion */
.curriculum{max-width:820px;margin:0 auto;}
.module-item{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow);
}
.module-head{
  display:flex;align-items:center;gap:16px;padding:20px 24px;cursor:pointer;
}
.module-num{
  min-width:42px;height:42px;border-radius:50%;background:var(--navy);color:var(--gold-light);
  display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;
}
.module-head .titles{flex:1;}
.module-head .titles .ta{font-weight:600;font-size:1.02rem;color:var(--navy);}
.module-head .titles .en{font-size:.85rem;color:var(--muted);font-family:'Poppins',sans-serif;}
.module-head .chevron{color:var(--gold);font-size:1.3rem;transition:transform .2s;}
.module-item.open .chevron{transform:rotate(180deg);}
.module-body{max-height:0;overflow:hidden;transition:max-height .25s ease;padding:0 24px;}
.module-item.open .module-body{padding:0 24px 22px;}
.module-body p{color:var(--muted);font-size:.95rem;margin:0;}

/* pricing */
.price-card{
  max-width:460px;margin:0 auto;background:var(--navy);color:var(--white);
  border-radius:20px;padding:44px 36px;text-align:center;box-shadow:var(--shadow);
  border:1px solid rgba(201,162,39,.4);
}
.price-card .price{font-family:'Poppins',sans-serif;font-size:3rem;font-weight:700;color:var(--gold-light);margin:14px 0 4px;}
.price-card .price small{font-size:1rem;color:#C7CCD8;font-weight:400;}
.price-list{text-align:left;list-style:none;padding:0;margin:26px 0;}
.price-list li{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:.95rem;color:#E4E7EE;}
.price-list li::before{content:"✓ ";color:var(--gold);font-weight:700;}
.razorpay-wrap{margin-top:20px;}

footer{background:var(--navy-deep);color:#B9C0CE;padding:44px 0 28px;font-size:.9rem;}
footer .container{display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;}
footer a{color:#D8DEE9;}
footer a:hover{color:var(--gold-light);}
.footer-motto{color:var(--gold-light);font-family:'Poppins',sans-serif;font-style:italic;margin-top:8px;}

.whatsapp-fab{
  position:fixed;bottom:24px;right:24px;background:#25D366;color:#fff;
  width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:1.6rem;z-index:60;
}

/* auth / gated pages */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--navy),var(--navy-deep));padding:24px;
}
.auth-card{
  background:var(--white);border-radius:18px;padding:40px 34px;max-width:420px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}
.auth-card h1{font-size:1.4rem;text-align:center;}
.auth-card .sub{color:var(--muted);text-align:center;font-size:.9rem;margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:.85rem;font-family:'Poppins',sans-serif;font-weight:600;margin-bottom:6px;color:var(--navy);}
.field input{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
  font-size:.95rem;font-family:inherit;
}
.field input:focus{outline:none;border-color:var(--gold);}
.error-msg{color:#B3261E;font-size:.85rem;margin:10px 0;display:none;}
.auth-footer{text-align:center;font-size:.85rem;color:var(--muted);margin-top:18px;}

/* course home */
.course-home-header{
  background:var(--navy);color:#fff;padding:34px 0;
}
.course-home-header .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.progress-wrap{background:rgba(255,255,255,.12);border-radius:999px;height:8px;width:220px;overflow:hidden;}
.progress-bar{height:100%;background:var(--gold);width:0%;transition:width .3s;}
.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
@media(max-width:760px){.module-grid{grid-template-columns:1fr;}}
.mod-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;
  display:flex;gap:16px;align-items:flex-start;box-shadow:var(--shadow);
}
.mod-card .num{
  min-width:38px;height:38px;border-radius:50%;background:var(--cream);border:2px solid var(--gold);
  color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Poppins',sans-serif;
}
.mod-card.done .num{background:var(--gold);color:var(--navy-deep);}
.mod-card .ta{font-weight:600;color:var(--navy);}
.mod-card .en{font-size:.82rem;color:var(--muted);font-family:'Poppins',sans-serif;}
.mod-card .go{margin-top:10px;display:inline-block;font-size:.85rem;font-weight:600;color:var(--gold);font-family:'Poppins',sans-serif;}

/* module content page */
.module-header{background:var(--navy);color:#fff;padding:30px 0;}
.module-header .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.module-header .crumb{font-size:.85rem;color:var(--gold-light);font-family:'Poppins',sans-serif;}
.module-header h1{color:#fff;font-size:1.5rem;margin-top:6px;}
.module-header .en-sub{color:#C7CCD8;font-size:.9rem;font-family:'Poppins',sans-serif;}

.lesson-content{max-width:760px;margin:0 auto;padding:44px 24px 20px;}
.lesson{margin-bottom:38px;}
.lesson h2{font-size:1.3rem;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:16px;}
.lesson h3{font-size:1.08rem;color:var(--navy-soft);margin-top:22px;}
.lesson h4{font-size:.98rem;color:var(--gold);text-transform:none;margin-top:16px;}
.lesson p{margin:0 0 12px;color:#2B3340;}
.lesson p.lead{font-weight:600;color:var(--navy);}

.module-nav{
  max-width:760px;margin:0 auto;padding:10px 24px 60px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.complete-bar{
  max-width:760px;margin:0 auto;padding:0 24px 30px;text-align:center;
}
.complete-check{display:inline-flex;align-items:center;gap:10px;font-family:'Poppins',sans-serif;font-weight:600;cursor:pointer;}
.complete-check input{width:20px;height:20px;accent-color:var(--gold);}

@media print{
  .site-header,.module-header,.module-nav,.complete-bar,.whatsapp-fab,footer{display:none !important;}
  body{background:#fff;}
}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>உள்நுழையவும்</h1>
    <div class="sub">Life Skills Mastery for Educators · Paid Professional Course</div>

    <div id="error-box" class="error-msg"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-gold btn-block" id="login-btn">உள்நுழையவும் / Login</button>

    <div class="auth-footer">
      இன்னும் course-ல் சேரவில்லையா? <a href="index.html#pricing" style="color:var(--gold);font-weight:600;">Enroll ஆகவும்</a><br>
      சேர்ந்தும் login problem-ஆ? <a href="https://wa.me/919843702244" style="color:var(--gold);font-weight:600;">WhatsApp-ல் தொடர்பு கொள்ளவும்</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const errorBox = document.getElementById('error-box');
  const loginBtn = document.getElementById('login-btn');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  loginBtn.addEventListener('click', function () {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) {
      showError('Email மற்றும் Password இரண்டையும் உள்ளிடவும்.');
      return;
    }
    loginBtn.textContent = 'Checking...';
    auth.signInWithEmailAndPassword(email, password)
      .then(function () {
        const redirectTo = sessionStorage.getItem('redirectAfterLogin') || 'course-home.html';
        sessionStorage.removeItem('redirectAfterLogin');
        window.location.href = redirectTo;
      })
      .catch(function (err) {
        loginBtn.textContent = 'உள்நுழையவும் / Login';
        showError('Login தவறு: ' + err.message);
      });
  });
</script>
</body>
</html>
